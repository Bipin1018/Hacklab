<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korjaa</title>
<style>
:root { --bg:#0e1116; --panel:#1b2129; --text:#f5f7fa; --muted:#a8b3bf; --accent:#3ddc97; --amber:#ffb020; --red:#e5383b; }
* { box-sizing:border-box; }
body { margin:0; padding:16px 16px 100px; background:var(--bg); color:var(--text); font:18px/1.45 system-ui,sans-serif; }
main { max-width:640px; margin:auto; }
h1 { margin:0; font-size:28px; }
button { min-height:62px; border:0; border-radius:14px; background:var(--panel); color:var(--text); font-size:18px; font-weight:700; }
#start { width:100%; background:var(--accent); color:#04130c; }
#controls { display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
#status,#counter,#sources,#photoStatus,footer { color:var(--muted); font-size:15px; }
#detail { margin-bottom:10px; font-size:18px; }
#uses { margin-bottom:12px; color:var(--accent); font-size:16px; font-weight:700; }
#screen { min-height:120px; margin:16px 0; font-size:27px; font-weight:700; }
#screen.amber { color:var(--amber); }
#stop { position:fixed; left:16px; right:16px; bottom:16px; width:calc(100% - 32px); background:var(--red); color:#fff; }
form { display:flex; gap:8px; margin-top:16px; }
input { flex:1; min-width:0; padding:14px; border:0; border-radius:12px; background:var(--panel); color:var(--text); font-size:17px; }
form button { min-height:52px; padding:0 16px; }
video { display:none; width:100%; margin-top:16px; border-radius:14px; }
.item { margin-top:10px; padding:12px; border-radius:12px; background:var(--panel); }
a { display:block; padding:6px 0; color:var(--accent); }
footer { margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>Korjaa</h1>
  <div id="status">Tap start, then ask for help with a task.</div>
  <div id="counter"></div>
  <div id="screen">Hands-free help for real tasks</div>
  <div id="detail"></div>
  <div id="uses"></div>
  <button id="start">Start</button>
  <div id="photoStatus"></div>
  <div id="items"></div>
  <section id="controls">
    <button data-cmd="next">Next</button>
    <button data-cmd="repeat">Repeat</button>
    <button data-cmd="stuck">Stuck</button>
    <button data-cmd="back">Back</button>
    <button data-cmd="camera">Camera</button>
    <button id="addPhotos">Add photos</button>
    <button data-cmd="continue">Continue</button>
    <button data-cmd="ready">Ready</button>
    <button data-cmd="start over">New task</button>
    <button data-cmd="I understand the risk">I understand the risk</button>
  </section>
  <form id="typed"><input id="text" placeholder="Or type here" autocomplete="off"><button>Send</button></form>
  <input id="photos" type="file" accept="image/*" multiple hidden>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>
  <div id="sources"></div>
  <footer>Voice by ElevenLabs. AI steps can be wrong, so use your own judgement.</footer>
</main>
<button id="stop">STOP</button>
<script>
const $ = id => document.getElementById(id);
const sessionId = crypto.randomUUID();
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let audioCtx, recognition, source, wakeLock = null, listening = false, speaking = false, phase = "idle", busy = false;

async function post(url, body) {
  const response = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!response.ok) throw new Error(url);
  return response;
}

async function send(text) {
  if (busy && text !== "stop") return;
  busy = true;
  try {
    if (["idle","ended","done","stopped"].includes(phase) && text !== "stop") {
      $("status").textContent = "Searching online";
      $("screen").textContent = "Looking that up...";
    }
    const result = await (await post("/api/turn", { session_id:sessionId, text })).json();
    await render(result);
  } catch {
    $("status").textContent = "Connection problem. Try again.";
  }
  busy = false;
}

async function render(result) {
  phase = result.phase;
  $("screen").textContent = result.screen;
  $("screen").className = phase === "caution" ? "amber" : "";
  $("counter").textContent = result.step ? `${result.step} of ${result.total}` : result.title;
  $("detail").textContent = result.detail;
  $("uses").textContent = result.uses.length ? `Use: ${result.uses.join(", ")}` : "";
  $("photoStatus").textContent = result.photo_count ? `${result.photo_count} of 6 photos added` : "";
  renderItems(result.items.length ? result.items : result.seen_parts.map(part => ({
    name: `${part.count} x ${part.name}${part.looks_like ? `: ${part.looks_like}` : ""}`, links:[],
  })));
  renderSources(result.sources);
  updateWakeLock();
  await speak(result.say);
  if (result.action === "camera") await capture();
}

function makeLink(label, url) {
  const a = document.createElement("a");
  a.textContent = label;
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function renderItems(items) {
  $("items").replaceChildren();
  for (const item of items) {
    const box = document.createElement("div");
    box.className = "item";
    box.textContent = item.name;
    for (const link of item.links) box.append(makeLink(link.shop, link.url));
    $("items").append(box);
  }
}

function renderSources(sources) {
  $("sources").replaceChildren();
  for (const item of sources) $("sources").append(makeLink(`Source: ${item.title}`, item.url));
}

async function speak(text) {
  speaking = true;
  if (recognition) try { recognition.stop(); } catch {}
  $("status").textContent = "Speaking";
  try {
    const response = await post("/api/tts", { text });
    const audio = await audioCtx.decodeAudioData(await response.arrayBuffer());
    await new Promise(resolve => {
      source = audioCtx.createBufferSource();
      source.buffer = audio;
      source.connect(audioCtx.destination);
      source.onended = resolve;
      source.start();
    });
  } catch {
    await new Promise(resolve => {
      const line = new SpeechSynthesisUtterance(text);
      line.onend = line.onerror = resolve;
      speechSynthesis.speak(line);
    });
  }
  speaking = false;
  startListening();
}

function startListening() {
  if (recognition && listening && !speaking) try { recognition.start(); } catch {}
  $("status").textContent = recognition ? "Listening" : "Use the buttons or type";
}

function setupVoice() {
  if (!Recognition) return;
  recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.onresult = event => {
    const text = event.results[event.results.length - 1][0].transcript.trim();
    if (text && !speaking) send(text);
  };
  recognition.onend = () => startListening();
  listening = true;
}

async function updateWakeLock() {
  const active = ["caution","items","gate","steps"].includes(phase);
  try {
    if (active && !wakeLock && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    if (!active && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  canvas.width = bitmap.width * scale;
  canvas.height = bitmap.height * scale;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
}

async function uploadPhotos(files) {
  if (busy || !files.length) return;
  busy = true;
  try {
    $("status").textContent = "Reading your photos";
    $("screen").textContent = "Looking at your photos...";
    const images = await Promise.all([...files].slice(0, 6).map(shrink));
    await render(await (await post("/api/photos", { session_id:sessionId, images })).json());
  } catch {
    $("status").textContent = "Photo upload failed. Try again.";
  }
  busy = false;
}

async function capture() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } });
    const video = $("video"), canvas = $("canvas");
    video.srcObject = stream;
    video.style.display = "block";
    await new Promise(resolve => setTimeout(resolve, 3000));
    const scale = Math.min(1, 1024 / video.videoWidth);
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const image = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    $("status").textContent = "Checking photo";
    await render(await (await post("/api/vision", { session_id:sessionId, image })).json());
  } catch {
    await speak("I couldn't take a photo. Check camera permission and try again.");
  } finally {
    stream?.getTracks().forEach(track => track.stop());
    $("video").style.display = "none";
  }
}

$("start").onclick = async () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  $("start").style.display = "none";
  $("controls").style.display = "grid";
  setupVoice();
  await speak("What do you need help with?");
  $("screen").textContent = "What do you need help with?";
};
$("stop").onclick = () => {
  try { source?.stop(); } catch {}
  speechSynthesis.cancel();
  speaking = false;
  send("stop");
};
document.querySelectorAll("[data-cmd]").forEach(button => button.onclick = () => send(button.dataset.cmd));
$("addPhotos").onclick = () => $("photos").click();
$("photos").onchange = async event => {
  await uploadPhotos(event.target.files);
  event.target.value = "";
};
$("typed").onsubmit = event => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (text) send(text);
  $("text").value = "";
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { wakeLock = null; updateWakeLock(); }
});
</script>
</body>
</html>
